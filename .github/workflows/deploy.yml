name: Deploy Single-File Portfolio

on:
  push:
    branches: [ master ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject API Key into index.html
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is missing or empty!"
            exit 1
          fi
          
          # Replace placeholder string
          sed -i "s|__GEMINI_API_KEY__|${GEMINI_KEY}|g" index.html
          
          # Verify replacement worked
          if grep -q "__GEMINI_API_KEY__" index.html; then
            echo "::error::Replacement failed! Placeholder __GEMINI_API_KEY__ was still found in index.html"
            exit 1
          else
            echo "SUCCESS: Key successfully injected into index.html"
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
